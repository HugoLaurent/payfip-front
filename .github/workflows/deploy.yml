name: Deploy

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: hlaurent
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/payfip/payfip-front-src
            git pull origin main
            sudo /opt/payfip/deploy/bin/compose-deploy.sh build payfip-front
            sudo /opt/payfip/deploy/bin/compose-deploy.sh up -d payfip-front
