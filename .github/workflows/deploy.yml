name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: hlaurent
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/payfip/payfip-front-src
            git pull origin main
            cd /opt/payfip/deploy
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build payfip-front
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d payfip-front
