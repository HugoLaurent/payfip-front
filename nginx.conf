server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Défense en profondeur : le front ne charge aucun script externe ni
    # inline (voir index.html — un seul <script type="module"> vers un
    # fichier propre), donc script-src reste strict. style-src autorise
    # 'unsafe-inline' car des styles inline sont utilisés dans le code React
    # (ex. StaffSpace.tsx) — bien moins risqué qu'un script-src permissif,
    # une XSS par injection de style seule ne permet pas d'exécuter du code.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.aregie.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # SPA : toute route inconnue de nginx retombe sur index.html, laisse
    # react-router-dom décider (sinon 404 nginx sur un refresh de /scanner).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par Vite (assets/xxx-<hash>.js) — cache long, un
    # nouveau build produit toujours un nouveau nom de fichier.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
