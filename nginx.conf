server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA : toute route inconnue de nginx retombe sur index.html, laisse
    # react-router-dom décider (sinon 404 nginx sur un refresh de /scanner).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par Vite (assets/xxx-<hash>.js) — cache long, un
    # nouveau build produit toujours un nouveau nom de fichier.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
